services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_meeting_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ai_meeting_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - coolify

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-ai_meeting}:${POSTGRES_PASSWORD:-ai_meeting_pass}@postgres:5432/${POSTGRES_DB:-ai_meeting_db}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coolify

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a20-app-089-api
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-ai_meeting}:${POSTGRES_PASSWORD:-ai_meeting_pass}@postgres:5432/${POSTGRES_DB:-ai_meeting_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WHISPER_LIVEKIT_URL: ${WHISPER_LIVEKIT_URL:-}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.a20-app-089-api-https.rule=Host(`a20-app-089.smartnovi.tech`)
      - traefik.http.routers.a20-app-089-api-https.entrypoints=https
      - traefik.http.routers.a20-app-089-api-https.tls=true
      - traefik.http.routers.a20-app-089-api-https.tls.certresolver=letsencrypt
      - traefik.http.services.a20-app-089-api.loadbalancer.server.port=8000
      - traefik.http.routers.a20-app-089-api-http.rule=Host(`a20-app-089.smartnovi.tech`)
      - traefik.http.routers.a20-app-089-api-http.entrypoints=http
      - traefik.http.middlewares.a20-app-089-api-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.a20-app-089-api-redirect.redirectscheme.permanent=true
      - traefik.http.routers.a20-app-089-api-http.middlewares=a20-app-089-api-redirect@docker
    networks:
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A src.workers.celery_app worker
      -Q default --loglevel=info --concurrency=2
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-ai_meeting}:${POSTGRES_PASSWORD:-ai_meeting_pass}@postgres:5432/${POSTGRES_DB:-ai_meeting_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WHISPER_LIVEKIT_URL: ${WHISPER_LIVEKIT_URL:-}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    networks:
      - coolify

volumes:
  redis_data:
  app_data:

networks:
  coolify:
    external: true
