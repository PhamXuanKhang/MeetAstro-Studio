services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WHLK_WEBSOCKET_URL: ${WHLK_WEBSOCKET_URL}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  worker:
    build: .
    command: >
      celery -A src.workers.celery_app worker
      -Q default --loglevel=info --concurrency=2
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WHLK_WEBSOCKET_URL: ${WHLK_WEBSOCKET_URL}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data

volumes:
  redis_data:
