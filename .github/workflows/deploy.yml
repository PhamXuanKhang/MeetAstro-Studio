name: Mirror to Deploy Repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Force push to deploy repository
        run: |
          git remote add deploy "https://x-access-token:${{ secrets.MIRROR_REPO_TOKEN }}@github.com/PhamXuanKhang/MeetAstro-Studio.git"
          git push --force deploy HEAD:main