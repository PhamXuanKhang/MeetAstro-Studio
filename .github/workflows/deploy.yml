name: Mirror to Deploy Repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Force push to deploy repository
        shell: bash
        run: |
          git remote remove deploy 2>/dev/null || true
          git remote add deploy "https://x-access-token:${{ secrets.MIRROR_REPO_TOKEN }}@github.com/PhamXuanKhang/MeetAstro-Studio.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan mirror-public
          git rm -r --cached .github/workflows
          git commit -m "Mirror source without workflows"
          git push --force deploy mirror-public:main