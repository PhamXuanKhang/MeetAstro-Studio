name: Release Electron Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0'
        required: true
        type: string

jobs:
  release-windows:
    runs-on: self-hosted
    permissions:
      contents: read

    env:
      RELEASE_REPO: PhamXuanKhang/MeetAstro-Studio

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z, got '$tag'." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches tag
        shell: bash
        run: |
          package_version=$(node -p "require('./electron-app/package.json').version")
          expected="${{ steps.release_tag.outputs.version }}"
          if [ "$package_version" != "$expected" ]; then
            echo "Tag version $expected does not match electron-app/package.json version $package_version." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron-app

      - name: Install Wine for Windows installer build
        shell: bash
        run: |
          if ! command -v wine >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wine64
          fi

      - name: Build Electron installer
        run: npm run build -- --win --publish never
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Resolve installer artifact
        id: artifact
        shell: bash
        run: |
          version="${{ steps.release_tag.outputs.version }}"
          installer="electron-app/release/MeetAstro-Setup-$version.exe"
          if [ ! -f "$installer" ]; then
            echo "Installer not found at $installer." >&2
            exit 1
          fi
          size_bytes=$(wc -c < "$installer" | tr -d ' ')
          echo "path=$installer" >> "$GITHUB_OUTPUT"
          echo "name=MeetAstro-Setup-$version.exe" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"

      - name: Create or update release in public repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          repo="$RELEASE_REPO"
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$repo" \
              --title "MeetAstro $tag" \
              --generate-notes
          fi

      - name: Upload EXE release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" "${{ steps.artifact.outputs.path }}" \
            --repo "$RELEASE_REPO" \
            --clobber
