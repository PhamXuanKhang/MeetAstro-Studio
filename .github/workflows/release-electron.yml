name: Release Electron Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0'
        required: true
        type: string

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      RELEASE_REPO: PhamXuanKhang/MeetAstro-Studio

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vX.Y.Z, got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Verify package version matches tag
        shell: pwsh
        run: |
          $package = Get-Content "electron-app/package.json" -Raw | ConvertFrom-Json
          $expected = "${{ steps.release_tag.outputs.version }}"
          if ($package.version -ne $expected) {
            throw "Tag version $expected does not match electron-app/package.json version $($package.version)."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron-app

      - name: Build Electron installer
        run: npm run build
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

      - name: Resolve installer artifact
        id: artifact
        shell: pwsh
        run: |
          $version = "${{ steps.release_tag.outputs.version }}"
          $installer = "electron-app/release/MeetAstro-Setup-$version.exe"
          if (!(Test-Path $installer)) {
            throw "Installer not found at $installer."
          }
          $sizeBytes = (Get-Item $installer).Length
          "path=$installer" >> $env:GITHUB_OUTPUT
          "name=MeetAstro-Setup-$version.exe" >> $env:GITHUB_OUTPUT
          "size_bytes=$sizeBytes" >> $env:GITHUB_OUTPUT

      - name: Create or update release in public repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $repo = "$env:RELEASE_REPO"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repo `
              --title "MeetAstro $tag" `
              --generate-notes
          }

      - name: Upload EXE release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" "${{ steps.artifact.outputs.path }}" `
            --repo "$env:RELEASE_REPO" `
            --clobber
