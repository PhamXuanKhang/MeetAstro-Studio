[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a20-app-089"
version = "0.1.0"
requires-python = ">=3.9"
# Shared core (cả server lẫn frontend đều cần)
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Backend: FastAPI server + Celery worker + PostgreSQL
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery>=5.3",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "ffmpeg-python>=0.2.0",
]

# Frontend: Flet desktop app + local audio recording
frontend = [
    "flet[all]>=0.28",
    "sounddevice>=0.5.0",
    # Upstream explicitly rejects Linux; only macOS / Windows wheels exist.
    "pysysaudio==0.1.3; sys_platform == 'darwin' or sys_platform == 'win32'",
    "numpy>=1.26.0",
]

# Dev: testing + linting + type checking
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23",
]

# All-in-one cho local dev environment
all = [
    "a20-app-089[server]",
    "a20-app-089[frontend]",
    "a20-app-089[dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_site_packages = true

[tool.flake8]
max-line-length = 100

[tool.alembic]
script_location = "src/db/migrations"
